name: 打包跨平台

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: PDF_Toolbox-Windows
            dist_path: dist/PDF_Toolbox/
            exe_path: dist/PDF_Toolbox/PDF_Toolbox.exe
          - os: macos-latest
            artifact_name: PDF_Toolbox-macOS
            dist_path: dist/PDF_Toolbox/
            exe_path: dist/PDF_Toolbox/PDF_Toolbox
            brew_install: brew install qpdf
          - os: ubuntu-latest
            artifact_name: PDF_Toolbox-Linux
            dist_path: dist/PDF_Toolbox/
            exe_path: dist/PDF_Toolbox/PDF_Toolbox

    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装系统依赖 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk fonts-wqy-microhei

      - name: 清理未使用的 Homebrew tap (macOS)
        if: runner.os == 'macOS'
        run: brew untap aws/tap azure/bicep 2>/dev/null || true

      - name: 安装 qpdf (macOS)
        if: runner.os == 'macOS'
        run: brew install qpdf

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow ttkbootstrap

      - name: 打包
        env:
          QPDF_VERSION: "12.3.2"
          PYTHONIOENCODING: utf-8
        run: python build.py --no-pause

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.dist_path }}

      - name: 创建 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.exe_path }}
          generate_release_notes: true

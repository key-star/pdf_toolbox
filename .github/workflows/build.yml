name: 打包 EXE

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow ttkbootstrap

      - name: 打包 EXE
        env:
          QPDF_VERSION: "12.3.2"
          PYTHONIOENCODING: utf-8
        run: python build_exe.py --no-pause

      - name: 调试 - 列出 dist 目录
        if: always()
        run: |
          echo "=== 检查 dist 目录 ==="
          if (Test-Path dist) { Get-ChildItem -Recurse dist } else { echo "dist 目录不存在" }
          echo "=== 检查当前目录 ==="
          Get-ChildItem -Directory | Select-Object Name
          echo "=== 检查 qpdf_temp 目录 ==="
          if (Test-Path qpdf_temp) { Get-ChildItem qpdf_temp } else { echo "qpdf_temp 不存在" }
          echo "=== 检查 qpdf_cache 目录 ==="
          if (Test-Path qpdf_cache) { Get-ChildItem -Recurse qpdf_cache } else { echo "qpdf_cache 不存在" }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: PDF_Toolbox-Windows
          path: dist/PDF_Toolbox/

      - name: 创建 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PDF_Toolbox/PDF_Toolbox.exe
          generate_release_notes: true
